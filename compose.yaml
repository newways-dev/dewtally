# Development: "docker compose up -d", then in api/: ".\mvnw.cmd spring-boot:run" (services without a profile).
# Full stack in containers: in api/ ".\mvnw.cmd package -DskipTests", then here "docker compose --profile app up -d --build".

# Settings shared by api and worker
x-app: &app
  image: dewtally:local
  restart: unless-stopped
  depends_on: [ postgres, rabbitmq ]
  volumes:
    - documents:/app/data
  environment: &app-env
    # Inside Docker the database and broker are reached by service name, not localhost
    SPRING_DOCKER_COMPOSE_ENABLED: "false"
    SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/dewtally
    SPRING_DATASOURCE_USERNAME: dewtally
    SPRING_DATASOURCE_PASSWORD: dewtally
    SPRING_RABBITMQ_HOST: rabbitmq
    # Inside Docker the keys are fetched from keycloak:8080; the token's issuer stays localhost:8180
    SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/dewtally/protocol/openid-connect/certs

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: dewtally
      POSTGRES_USER: dewtally
      POSTGRES_PASSWORD: dewtally
    ports:
      - "5432:5432"

  rabbitmq:
    # "management" adds a web UI on http://localhost:15672 to watch the queues
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: dewtally
      RABBITMQ_DEFAULT_PASS: dewtally
    ports:
      - "5672:5672"
      - "15672:15672"

  keycloak:
    # Login server (OpenID Connect). Admin console: http://localhost:8180 (admin / admin, local only)
    image: quay.io/keycloak/keycloak:26.3
    command: [ "start-dev", "--import-realm" ]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Tokens always name http://localhost:8180 as issuer, whether fetched from the host or from a container
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      # Filled into the realm file on import: the web UI and its client secret (local values only)
      DEWTALLY_WEB_URL: http://localhost:3000
      DEWTALLY_WEB_CLIENT_SECRET: local-dev-only-web-secret
    volumes:
      - ./keycloak/dewtally-realm.json:/opt/keycloak/data/import/dewtally-realm.json:ro
    ports:
      - "8180:8080"

  api:
    <<: *app
    profiles: [ app ]
    build: ./api
    environment:
      <<: *app-env
      SPRING_PROFILES_ACTIVE: api
    ports:
      - "8080:8080"

  worker:
    <<: *app
    profiles: [ app ]
    depends_on: [ postgres, rabbitmq, api ]
    # The worker calls the language model: OPENAI_API_KEY comes from the local .env (never committed)
    env_file:
      - path: .env
        required: false
    environment:
      <<: *app-env
      SPRING_PROFILES_ACTIVE: worker
    # Untrusted PDFs are parsed here: a broken file can use up at most this much
    mem_limit: 1g
    cpus: 1.0

  prometheus:
    profiles: [ app ]
    image: prom/prometheus:v3.5.0
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    profiles: [ app ]
    image: grafana/grafana:12.1.0
    depends_on: [ prometheus ]
    environment:
      # Local only: anyone may look, the admin password is for changes
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: dewtally
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"

volumes:
  documents: