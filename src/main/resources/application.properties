spring.application.name=dewtally
# Liquibase owns the schema (XML changelog)
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
# Hibernate only checks that entities match the schema, never changes it
spring.jpa.hibernate.ddl-auto=validate
# No lazy loading in the web layer: forces all DB access into services/transactions
spring.jpa.open-in-view=false
# Keep the local Postgres container running after the app stops
spring.docker.compose.lifecycle-management=start-only
# Folder for uploaded original documents (local development only)
dewtally.storage.local-root=data/documents
# Invoices are small; reject anything unreasonably large
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# Official XRechnung validation (KoSIT). The configuration is downloaded separately (see README).
dewtally.validation.kosit.enabled=true
dewtally.validation.kosit.scenarios=kosit/xrechnung/scenarios.xml
# PDF text extraction: limits keep model costs predictable (an invoice rarely has more than a few pages)
dewtally.extraction.pdf.max-pages=20
dewtally.extraction.pdf.max-chars=50000
# LLM (Spring AI + OpenAI). The key comes from the environment and is never committed.
# "missing" keeps the app and the tests starting without a key; real calls then fail with 401.
spring.ai.openai.api-key=${OPENAI_API_KEY:missing}
spring.ai.openai.chat.model=gpt-5-mini
# Local secrets from .env (not committed). "optional:" = no error if the file does not exist (CI).
spring.config.import=optional:file:.env[.properties]
dewtally.extraction.min-confidence=0.8
# Time limits for slow or hanging work on untrusted input and external services
dewtally.extraction.llm-timeout=60s
dewtally.extraction.pdf-timeout=20s
# Bulkhead for PDF parsing: a few stuck files can never take down the whole application
dewtally.extraction.pdf-max-concurrent=2
dewtally.extraction.pdf-max-queued=10
# Process uploads in the background through RabbitMQ (false: process during the upload request)
dewtally.processing.async=true
# How often the outbox relay looks for unsent messages
dewtally.outbox.poll-interval-ms=1000
# Local RabbitMQ credentials (same as compose.yaml); the Docker Compose integration overrides them when it finds the container
spring.rabbitmq.username=dewtally
spring.rabbitmq.password=dewtally
# Retries for temporary processing errors: 4 attempts with growing pauses (5 s, 25 s, 2 min).
# After the last one the message goes to the dead letter queue and the document is marked FAILED.
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=4
spring.rabbitmq.listener.simple.retry.initial-interval=5s
spring.rabbitmq.listener.simple.retry.multiplier=5
spring.rabbitmq.listener.simple.retry.max-interval=2m
# Roles: by default one process does everything (development, tests).
# In containers the "api" and "worker" profiles switch parts off.
dewtally.processing.listener-enabled=true
dewtally.outbox.relay-enabled=true
# Metrics: health and Prometheus endpoints; every metric carries the application and the role (all, api, worker)
management.endpoints.web.exposure.include=health,prometheus
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.role=all
# Histograms, so Grafana can show percentiles (p95) of processing and model call times
management.metrics.distribution.percentiles-histogram.dewtally.documents.processing=true
management.metrics.distribution.percentiles-histogram.dewtally.llm.extraction=true
management.metrics.distribution.maximum-expected-value.dewtally.documents.processing=2m
management.metrics.distribution.maximum-expected-value.dewtally.llm.extraction=2m