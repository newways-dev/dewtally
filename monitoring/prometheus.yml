# Collects metrics from api and worker every 15 seconds.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: dewtally-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [ "api:9091" ]   # management port, not published outside Docker
  - job_name: dewtally-worker
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [ "worker:8081" ]