# Continuous integration: build and test on every push to main and every pull request.
# After a push to main (or a version tag), the Docker images are published to GitHub Container Registry.
name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    # GITHUB_TOKEN may read the code and publish packages (the images); nothing else.
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: api/pom.xml

      # The wrapper is committed from Windows without the executable bit.
      - name: Make Maven wrapper executable
        working-directory: api
        run: chmod +x mvnw

      # Runs unit and integration tests. Testcontainers uses the Docker daemon
      # that is pre-installed on GitHub-hosted Ubuntu runners.
      # Also builds the jar that the Docker image is made from.
      - name: Build and test the backend
        working-directory: api
        run: ./mvnw -B verify

      # Everything below runs only for accepted code: a push to main or a version tag, never for a pull request.

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: github.event_name == 'push'
        uses: docker/setup-buildx-action@v3

      # Image tags: the commit (sha-...), "latest" for main, and the version for tags like v0.6.0
      - name: Application image tags and labels
        if: github.event_name == 'push'
        id: meta_app
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - name: Build and push application image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: ${{ steps.meta_app.outputs.tags }}
          labels: ${{ steps.meta_app.outputs.labels }}

      # Keycloak with the dewtally realm built in (used in Azure, where no file can be mounted)
      - name: Keycloak image tags and labels
        if: github.event_name == 'push'
        id: meta_keycloak
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-keycloak
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - name: Build and push Keycloak image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: ./keycloak
          push: true
          tags: ${{ steps.meta_keycloak.outputs.tags }}
          labels: ${{ steps.meta_keycloak.outputs.labels }}

  # Web UI: type check on every change; the image is built for pull requests too (so a broken Dockerfile
  # is noticed before merging), but only published for a push to main or a version tag.
  web:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    defaults:
      run:
        working-directory: web

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install pnpm
        run: npm install -g pnpm@12.15.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # PageProps, LayoutProps and RouteContext are generated from the app's routes into .next/types;
      # locally "pnpm dev" creates them, a fresh checkout in CI does not have them yet
      - name: Generate route types
        run: pnpm exec next typegen

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Web image tags and labels
        id: meta_web
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-web
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - name: Build (and for main, push) web image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta_web.outputs.tags }}
          labels: ${{ steps.meta_web.outputs.labels }}
          # Reuses unchanged layers from earlier runs: much faster builds
          cache-from: type=gha
          cache-to: type=gha,mode=max