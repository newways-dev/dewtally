spring.application.name=dewtally
# Liquibase owns the schema (XML changelog)
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
# Hibernate only checks that entities match the schema, never changes it
spring.jpa.hibernate.ddl-auto=validate
# No lazy loading in the web layer: forces all DB access into services/transactions
spring.jpa.open-in-view=false
# Keep the local Postgres container running after the app stops
spring.docker.compose.lifecycle-management=start-only
# Folder for uploaded original documents (local development only)
dewtally.storage.local-root=data/documents
# Invoices are small; reject anything unreasonably large
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# Official XRechnung validation (KoSIT). The configuration is downloaded separately (see README).
dewtally.validation.kosit.enabled=true
dewtally.validation.kosit.scenarios=kosit/xrechnung/scenarios.xml
# PDF text extraction: limits keep model costs predictable (an invoice rarely has more than a few pages)
dewtally.extraction.pdf.max-pages=20
dewtally.extraction.pdf.max-chars=50000
# LLM (Spring AI + OpenAI). The key comes from the environment and is never committed.
# "missing" keeps the app and the tests starting without a key; real calls then fail with 401.
spring.ai.openai.api-key=${OPENAI_API_KEY:missing}
spring.ai.openai.chat.model=gpt-5-mini
# Local secrets from .env (not committed). "optional:" = no error if the file does not exist (CI).
spring.config.import=optional:file:.env[.properties]
dewtally.extraction.min-confidence=0.8